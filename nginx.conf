server {
    listen 80;
    server_name _;

    # ── Compression ───────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        image/svg+xml;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options        SAMEORIGIN   always;
    add_header X-Content-Type-Options nosniff      always;
    add_header Referrer-Policy        same-origin  always;

    # ── API proxy → FastAPI backend ───────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Large evidence file uploads (up to 600 MB)
        client_max_body_size 600m;

        # Long-running background tasks (Chainsaw scans, DuckDB imports, …)
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 10s;
    }

    # ── Static assets served by FastAPI (no auth, UUID-based names) ──────────
    location /note-images/ {
        proxy_pass       http://backend:8000;
        proxy_set_header Host $host;
        expires          7d;
        add_header       Cache-Control "public";
    }

    location /knowledge-assets/ {
        proxy_pass       http://backend:8000;
        proxy_set_header Host $host;
        expires          7d;
        add_header       Cache-Control "public";
    }

    # ── React SPA — aggressive caching for hashed assets, no-cache for HTML ──
    # Hashed filenames (Vite adds content hash): cache forever
    location ~* \.(js|css|woff|woff2|ttf|eot)$ {
        root       /usr/share/nginx/html;
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        root       /usr/share/nginx/html;
        expires    30d;
        add_header Cache-Control "public";
        try_files  $uri =404;
    }

    # Main SPA entry point — never cache index.html so updates are instant
    location / {
        root       /usr/share/nginx/html;
        index      index.html;
        try_files  $uri $uri/ /index.html;

        # index.html must not be cached by the browser
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }
}
