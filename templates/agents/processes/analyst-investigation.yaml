id: analyst-investigation
description: Work one assigned task from understanding to report.
steps:
  - id: understand
    tools: [case_overview, ingest_status, list_artifacts, list_iocs, list_timeline, list_findings]
    instructions: |
      Restate the objective in one sentence. List the artifacts in this case that can answer
      it and the questions you will answer. Say plainly if the needed artifacts are missing.
  - id: plan
    tools: [list_artifacts, store_schema]
    instructions: |
      Give an ordered list of at most six checks, each naming the tool and the artifact or
      filter you will use. Read the schema of each artifact you plan to search.
  - id: execute
    tools: "@role"
    instructions: |
      Run the plan. Prefer narrow RQL filters. Keep each row that establishes a fact you will
      rely on with record_observation: an RQL filter that matches only that row (a record id,
      or the exact timestamp plus the event id) and a note of what it shows.
      If you need work outside your speciality, use request_help instead of guessing.
  - id: propose
    tools: [record_observation, propose_finding, propose_ioc, propose_timeline_event, propose_ttp,
            list_iocs, list_timeline, list_findings]
    instructions: |
      Propose findings with propose_finding: one conclusion each, citing the observation ids
      it rests on, with severity, confidence and the reason for that confidence. Then propose
      the indicators, key timeline events and ATT&CK techniques the findings establish, citing
      observation ids as evidence. Do not propose what is already recorded. Propose nothing
      that the data did not show.
  - id: report
    tools: []
    instructions: |
      Write the report for the Incident Leader: what you checked, the findings you proposed
      (F numbers), what remains unknown, and what you would check next.
