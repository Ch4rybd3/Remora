name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Maintains an open release pull request accumulating everything merged
      # into main. Merging that pull request tags the commit, writes
      # CHANGELOG.md and publishes the GitHub release. Never tag by hand.
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
