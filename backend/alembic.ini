# Alembic configuration for Remora.
#
# The database URL is NOT set here — it comes from app.config.settings at
# runtime (see alembic/env.py), so the CLI and the application always agree.
#
#   cd backend
#   alembic revision --autogenerate -m "add foo to bar"
#   alembic upgrade head
#   alembic downgrade -1

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
path_separator = os
# Revision files are prefixed with a UTC timestamp so `ls` orders them the way
# they were written, which matters when reviewing a long-lived branch.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
