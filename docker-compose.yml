services:

  # ── Backend — FastAPI + Uvicorn ──────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: remora-backend
    restart: unless-stopped
    volumes:
      # All runtime data (SQLite DB, evidences, DuckDB files, Chainsaw, …)
      - remora_data:/app/data
      # Drop folder — bind-mounted from the host so artifacts can be dropped
      # straight from a file manager. See DROPZONE_HOST_PATH in .env.
      - ${DROPZONE_HOST_PATH:-./dropzone}:/app/data/dropzone
      # Forensic disk images (E01, VMDK, raw…), mounted READ-ONLY. They are
      # read in place — a full acquisition is far too large to upload.
      - ${DISK_IMAGES_HOST_PATH:-./images}:/app/data/images:ro
    environment:
      # Validation: docker compose will refuse to start if SECRET_KEY is missing
      SECRET_KEY:             ${SECRET_KEY:?Please set SECRET_KEY in .env (see .env.example)}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-admin}
      CORS_ORIGINS:           ${CORS_ORIGINS:-http://localhost}
      DROPZONE_PATH:            /app/data/dropzone
      DROPZONE_AUTO_INGEST:     ${DROPZONE_AUTO_INGEST:-true}
      DROPZONE_POLL_SECONDS:    ${DROPZONE_POLL_SECONDS:-30}
      DROPZONE_STABLE_SECONDS:  ${DROPZONE_STABLE_SECONDS:-15}
      DISK_IMAGE_PATHS:         /app/data/images
      # Display-only: lets the UI show a copy-pasteable transfer command
      DISK_IMAGES_HOST_PATH:    ${DISK_IMAGES_HOST_PATH:-./images}
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - remora-net

  # ── Drop folder over SMB (opt-in) ────────────────────────────────────────────
  # Exposes the drop folder as a Windows/macOS/Linux network share so analysts
  # can drop artifacts from their own machine without SSH or a browser upload.
  #
  # Disabled by default — it opens a file-sharing port. Enable explicitly:
  #     docker compose --profile smb up -d
  #
  # Then map \\<server>\dropzone (Windows) or smb://<server>/dropzone (macOS),
  # with the credentials from SMB_USER / SMB_PASSWORD in .env.
  dropzone-smb:
    image: dperson/samba:latest
    container_name: remora-dropzone-smb
    profiles: ["smb"]
    restart: unless-stopped
    ports:
      # Defaults to localhost — set SMB_BIND_HOST=0.0.0.0 in .env to expose it
      # on the LAN, and only do that on a trusted network.
      - "${SMB_BIND_HOST:-127.0.0.1}:${SMB_PORT:-445}:445"
    volumes:
      - ${DROPZONE_HOST_PATH:-./dropzone}:/dropzone
    environment:
      SMB_USER:     ${SMB_USER:-remora}
      SMB_PASSWORD: ${SMB_PASSWORD:-}
    # The password is checked at runtime, not via ${VAR:?}: compose interpolates
    # every service in the file even when its profile is inactive, so a required
    # variable here would break a plain `docker compose up`.
    entrypoint:
      - sh
      - -c
      - |
        if [ -z "$$SMB_PASSWORD" ]; then
          echo "[dropzone-smb] SMB_PASSWORD is empty — refusing to start an unauthenticated share." >&2
          echo "[dropzone-smb] Set SMB_PASSWORD in .env, then: docker compose --profile smb up -d" >&2
          exit 1
        fi
        exec /sbin/tini -- /usr/bin/samba.sh \
          -u "$$SMB_USER;$$SMB_PASSWORD" \
          -s "dropzone;/dropzone;yes;no;no;$$SMB_USER" \
          -g "server min protocol = SMB2" \
          -p
    networks:
      - remora-net

  # ── Frontend — React SPA served by nginx + API reverse proxy ────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: remora-frontend
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-0.0.0.0}:${PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - remora-net

# ── Persistent storage ────────────────────────────────────────────────────────
volumes:
  remora_data:
    name: remora_data

# ── Internal network ──────────────────────────────────────────────────────────
networks:
  remora-net:
    driver: bridge
